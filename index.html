<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>El Ahorcado Web</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">
    <style>
        body { display: flex; align-items: center; min-height: 100vh; background-color: #11191f; }
        .contenedor-juego { max-width: 600px; width: 100%; margin: auto; }
        .pantalla { display: none; }
        .pantalla.activa { display: block; animation: fadeIn 0.4s ease-in-out; }
        .arte-ascii { font-family: 'Courier New', Courier, monospace; white-space: pre; background: #0d1117; padding: 1.5rem; border-radius: 12px; text-align: center; color: #2ea043; font-size: 1.2rem; line-height: 1.2; border: 1px solid #30363d; min-height: 180px; display: flex; align-items: center; justify-content: center; margin-bottom: 1.5rem; }
        .palabra-oculta { letter-spacing: 12px; font-size: 2.5rem; text-align: center; margin: 1.5rem 0; font-family: monospace; font-weight: bold; color: #e6edf3; }
        .teclado { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
        .teclado button { width: 48px; height: 48px; padding: 0; font-size: 1.2rem; font-weight: bold; border-radius: 8px; transition: all 0.2s; }
        .teclado button:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 4px 8px rgba(0,0,0,0.4); }
        .teclado button.acierto { background-color: #2ea043; border-color: #2ea043; color: white; opacity: 1; }
        .teclado button.error { background-color: #da3633; border-color: #da3633; color: white; opacity: 0.4; }
        .info-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; font-size: 1.1rem;}
        .vidas { font-size: 1.2rem;}
        table { text-align: center; margin-top: 1rem; }
        th { color: #58a6ff; font-weight: bold; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>
    <main class="container contenedor-juego">
        <article>
            <h1 style="text-align: center; margin-bottom: 1.5rem;">💀 El Ahorcado</h1>
            
            <div id="pantalla-carga" class="pantalla activa">
                <p aria-busy="true" style="text-align: center;">Cargando datos...</p>
            </div>

            <div id="pantalla-inicio" class="pantalla" style="text-align: center;">
                <button onclick="iniciarPartida()" style="margin-bottom: 2rem; max-width: 300px; margin-inline: auto;">🎮 Jugar Ahora</button>
                
                <h3>🏆 Salón de la Fama</h3>
                <figure>
                    <table role="grid">
                        <thead>
                            <tr>
                                <th>Top</th>
                                <th>Jugador</th>
                                <th>Puntaje</th>
                            </tr>
                        </thead>
                        <tbody id="tabla-ranking">
                            <!-- Se llena dinámicamente con JS -->
                        </tbody>
                    </table>
                </figure>
            </div>

            <div id="pantalla-juego" class="pantalla">
                <div class="info-bar">
                    <span><strong>Pista:</strong> <span id="pistaTexto" style="color: #58a6ff;"></span></span>
                    <span>Vidas: <span id="vidasTexto" class="vidas">❤️❤️❤️❤️❤️❤️</span></span>
                </div>
                <div class="arte-ascii" id="dibujoAhorcado"></div>
                <div class="palabra-oculta" id="palabraTexto"></div>
                <div class="teclado" id="tecladoContenedor"></div>
            </div>

            <div id="pantalla-resultado" class="pantalla" style="text-align: center;">
                <h2 id="mensajeFinal" style="font-size: 2.5rem;"></h2>
                <p style="font-size: 1.2rem;">La palabra era: <strong id="palabraRevelada" style="color: #58a6ff;"></strong></p>
                <p id="textoPuntaje" style="font-size: 1.5rem; font-weight: bold; display: none;">Tu puntaje: <span id="puntosFinales"></span></p>
                
                <form id="formPuntaje" style="display: none; max-width: 300px; margin: 2rem auto;">
                    <label for="nombreJugador">¡Registra tu victoria!</label>
                    <input type="text" id="nombreJugador" placeholder="Ingresa tu nombre" required>
                    <button type="submit" id="btnGuardar">Guardar Puntaje</button>
                </form>

                <!-- CAMBIO AQUÍ: Usamos volverAlMenu() en lugar de location.reload() -->
                <button class="secondary outline" onclick="volverAlMenu()" style="margin-top: 1rem; max-width: 300px; margin-inline: auto;">Volver al Menú</button>
            </div>
        </article>
    </main>
    <script src="script.js"></script>
</body>
</html>

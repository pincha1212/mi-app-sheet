<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ahorcado Web Serverless</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">
    <style>
        .palabra-oculta { letter-spacing: 10px; font-size: 2rem; text-align: center; margin: 1rem 0; font-family: monospace; }
        .teclado { display: flex; flex-wrap: wrap; gap: 5px; justify-content: center; max-width: 500px; margin: 0 auto; }
        .teclado button { width: 45px; height: 45px; padding: 0; text-align: center; font-weight: bold; }
        .arte-ascii { font-family: monospace; white-space: pre; background: #f4f4f4; padding: 1rem; border-radius: 8px; text-align: center; display: inline-block; color: #333; }
        .contenedor-juego { text-align: center; margin-top: 2rem; }
    </style>
</head>
<body>
    <main class="container contenedor-juego">
        <h1>El Ahorcado</h1>
        
        <div id="pantalla-carga"><p aria-busy="true">Conectando con Google Sheets...</p></div>

        <div id="pantalla-juego" style="display: none;">
            <p><strong>Pista:</strong> <span id="pistaTexto"></span></p>
            <div class="arte-ascii" id="dibujoAhorcado"></div>
            <div class="palabra-oculta" id="palabraTexto"></div>
            <p>Vidas restantes: <strong id="vidasTexto">6</strong></p>
            <div class="teclado" id="tecladoContenedor"></div>
        </div>

        <div id="pantalla-resultado" style="display: none;">
            <h2 id="mensajeFinal"></h2>
            <p>La palabra era: <strong id="palabraRevelada"></strong></p>
            
            <form id="formPuntaje" style="display: none; max-width: 400px; margin: 0 auto;">
                <label for="nombreJugador">¡Nuevo Récord! Ingresa tu nombre:</label>
                <input type="text" id="nombreJugador" required>
                <button type="submit" id="btnGuardar">Guardar Puntaje</button>
            </form>

            <button class="secondary" onclick="iniciarPartida()" style="margin-top: 1rem;">Jugar de nuevo</button>
        </div>
    </main>
    <script src="script.js"></script>
</body>
</html>

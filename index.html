<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aplicación Web - Base de Datos</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">
</head>
<body>
    <main class="container">
        <header>
            <h1>Sistema de Registro</h1>
        </header>
        
        <section>
            <form id="myForm">
                <label for="nombre">Nombre:</label>
                <input type="text" id="nombre" placeholder="Escribe tu nombre" required>

                <label for="mensaje">Mensaje:</label>
                <textarea id="mensaje" placeholder="Escribe tu mensaje" required></textarea>

                <button type="submit" id="btnSubmit">Enviar datos</button>
            </form>
        </section>
        
        <hr>
        
        <section>
            <h2>Registros Guardados</h2>
            <div id="data-container">Cargando datos...</div>
        </section>
    </main>
    <script src="script.js"></script>
</body>
</html>
